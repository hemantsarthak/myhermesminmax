name: Deploy site to Cloudflare Pages

# Deploys the static site in site/ to Cloudflare Pages on every push to main.
# This exists because the operator's laptop is turned off 8-12h/day; the site
# must keep serving and keep updating without the machine running.
#
# NOTE: the old `cloudflare/pages-action` no longer exists upstream, so we
# install wrangler and call it directly. Verified 2026-10-22: the previous
# version of this workflow failed with "Unable to resolve action
# `cloudflare/pages-action`, not found".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install wrangler
        run: npm install -g wrangler@4

      - name: Verify site integrity
        run: python3 scripts/verify_site.py

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler pages deploy ./site \
            --project-name=moneymmax \
            --branch=main \
            --commit-dirty=true

      - name: Summary
        run: echo "Deployed https://moneymmax.pages.dev/"
